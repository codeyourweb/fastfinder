name: fastfinder_build_windows_386

on: [push, pull_request]

jobs:
  windows_386_build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-toolchain
            mingw-w64-i686-pkg-config
            mingw-w64-i686-openssl
            base-devel
            autoconf
            automake
            libtool
            make
            unzip
            wget
            pkg-config

      - name: Install YARA v4.5.5 (i386)
        run: |
             wget -c https://github.com/VirusTotal/yara/archive/refs/tags/v4.5.5.zip -O /tmp/yara.zip
             cd /tmp && unzip yara.zip
             cd /tmp/yara-4.5.5
             ./bootstrap.sh
             ./configure --prefix=/mingw32 --host=i686-w64-mingw32 --disable-crypto --enable-static --disable-shared
             make -j$(nproc)
             make install

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
            go-version: 1.24
      - uses: actions/checkout@v2

      - name: Build FastFinder (i386)
        run: |
          # Use MinGW 32-bit environment
          export PATH="/mingw32/bin:$PATH"
          export PKG_CONFIG_PATH="/mingw32/lib/pkgconfig"
          
          # Convert paths to mixed mode (Windows style with forward slashes) for CGO
          _INCLUDE_PATH=$(cygpath -m /mingw32/include)
          _LIB_PATH=$(cygpath -m /mingw32/lib)
          
          export CGO_CFLAGS="-I${_INCLUDE_PATH}"
          
          export CGO_ENABLED=1
          export GOOS=windows
          export GOARCH=386
          
          # Check if library exists
          ls -l /mingw32/lib/libyara.a
          
          # Force static linking for MinGW-w64 with full paths
          export CGO_LDFLAGS="-L${_LIB_PATH} -lyara -lws2_32 -limagehlp -static"
          
          go build -v -ldflags "-s -w -extldflags '-static'" -tags yara_static,yara_no_pkg_config -o fastfinder-386.exe .
          ls -l fastfinder-386.exe
          ./fastfinder-386.exe -h
